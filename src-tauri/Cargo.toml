[package]
name = "venom-pdf"
version = "0.1.0"
description = "A Tauri App to invert PDFs"
authors = ["Venom PDF"]
edition = "2021"

[lib]
name = "venom_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.34"
image = "0.25"
rayon = "1.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
